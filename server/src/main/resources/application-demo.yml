# Local H2 profile. ZHIYI_JWT_SECRET is still required.
spring:
  datasource:
    url: "jdbc:h2:file:${user.home}/.zhiyi/demo;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
