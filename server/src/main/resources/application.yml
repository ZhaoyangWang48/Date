spring:
  application:
    name: zhiyi-server
  datasource:
    url: ${ZHIYI_DB_URL:jdbc:mysql://127.0.0.1:3306/zhiyi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${ZHIYI_DB_USERNAME:zhiyi_app}
    password: ${ZHIYI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${PORT:8080}
  address: ${ZHIYI_SERVER_ADDRESS:127.0.0.1}
zhiyi:
  jwt:
    # Required: provide at least 32 random characters through the environment.
    secret: ${ZHIYI_JWT_SECRET}
    expiration-days: 7
  storage:
    upload-dir: ${ZHIYI_UPLOAD_DIR:${user.dir}/uploads}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
