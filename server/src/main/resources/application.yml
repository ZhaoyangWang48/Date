
spring:
  application:
    name: zhiyi-server
  datasource:
    url: ${ZHIYI_DB_URL:jdbc:mysql://127.0.0.1:3306/zhiyi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${ZHIYI_DB_USERNAME:zhiyi_app}
    password: ${ZHIYI_DB_PASSWORD:REMOVED_SECRET}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
server:
  port: ${PORT:8080}
  address: 0.0.0.0
zhiyi:
  jwt:
    # 至少 32 字符；请通过环境变量 ZHIYI_JWT_SECRET 覆盖。
    secret: ${ZHIYI_JWT_SECRET:REMOVED_SECRET}
    expiration-days: 7
  storage:
    upload-dir: ${ZHIYI_UPLOAD_DIR:${user.dir}/uploads}
  demo:
    seed-enabled: ${ZHIYI_DEMO_SEED_ENABLED:true}
  ai:
    api-key: ${ZHIYI_AI_API_KEY:REMOVED_SECRET016b1cdcb8}
    base-url: ${ZHIYI_AI_BASE_URL:https://api.deepseek.com}
    embedding-model: ${ZHIYI_AI_EMBEDDING_MODEL:}
    chat-model: ${ZHIYI_AI_CHAT_MODEL:deepseek-v4-flash}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
